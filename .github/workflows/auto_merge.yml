name: Auto Approve & Merge Jules PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-approve and merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # اگر PR ڈرافٹ (Draft) میں ہے تو اسے ریڈی کریں
          gh pr ready "$PR_NUMBER" --repo "${{ github.repository }}" || true
          
          # PR کو فوری طور پر Main برانچ میں Merge کر دیں اور فالتو برانچ ڈیلیٹ کر دیں
          gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" --merge --delete-branch || \
          gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" --auto --merge --delete-branch
