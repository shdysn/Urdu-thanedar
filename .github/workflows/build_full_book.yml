name: 1 - Page Wise Digitizer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'input/**'
      - '*.pdf'

permissions:
  contents: write

jobs:
  digitize_pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai pymupdf pillow

      - name: Create Page-wise JSON & TXT
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - << 'EOF'
          import os, io, re, glob, json, time
          import fitz
          from PIL import Image
          import google.generativeai as genai

          INPUT_DIR = "input"
          PAGES_JSON_DIR = os.path.join("output", "pages_json")
          PAGES_TXT_DIR = os.path.join("output", "pages_txt")
          os.makedirs(PAGES_JSON_DIR, exist_ok=True)
          os.makedirs(PAGES_TXT_DIR, exist_ok=True)

          api_key = os.environ.get("GEMINI_API_KEY")
          if not api_key:
              print("GEMINI_API_KEY is not set!")
              exit(0)

          genai.configure(api_key=api_key)
          model = genai.GenerativeModel("gemini-2.5-flash")

          PROMPT = """آپ ایک ماہر اردو اور عربی آرکائیول ڈیجیٹائزر ہیں۔
          اس صفحے کے تمام متن کو ہو بہو یونیکوڈ اردو/عربی میں لکھیں۔
          1. کوئی لفظ اپنی طرف سے نہ بڑھائیں اور نہ کم کریں۔
          2. قرآنی آیات کو اعراب کے ساتھ ﴿ ﴾ بریکٹس میں لکھیں۔
          3. پیراگراف کے درمیان خالی لائن رکھیں، لیکن ایک ہی پیراگراف کی سطروں کو بیچ سے نہ توڑیں۔
          4. صرف صفحے کا اصل متن لکھیں۔"""

          def ocr_img(img):
              for attempt in range(3):
                  try:
                      res = model.generate_content([PROMPT, img])
                      if res and res.text:
                          return res.text.strip()
                  except Exception as e:
                      print(f"Retry {attempt+1}: {e}")
                      time.sleep(5)
              return ""

          def save_page(page_num, text):
              # 1. پیج کی الگ TXT فائل
              txt_path = os.path.join(PAGES_TXT_DIR, f"page_{page_num:04d}.txt")
              with open(txt_path, "w", encoding="utf-8") as tf:
                  tf.write(text)
              # 2. پیج کی الگ JSON فائل
              json_path = os.path.join(PAGES_JSON_DIR, f"page_{page_num:04d}.json")
              with open(json_path, "w", encoding="utf-8") as jf:
                  json.dump({"page": page_num, "content": text}, jf, ensure_ascii=False, indent=2)

          # PDF فائلوں کی پروسیسنگ
          pdf_files = glob.glob(os.path.join(INPUT_DIR, "*.pdf")) + glob.glob("*.pdf")
          for pdf_path in pdf_files:
              doc = fitz.open(pdf_path)
              for idx in range(len(doc)):
                  p_num = idx + 1
                  j_path = os.path.join(PAGES_JSON_DIR, f"page_{p_num:04d}.json")
                  if os.path.exists(j_path):
                      continue
                  print(f"Processing Page {p_num}...")
                  pix = doc.load_page(idx).get_pixmap(dpi=200)
                  img = Image.open(io.BytesIO(pix.tobytes("png")))
                  text = ocr_img(img)
                  if text:
                      save_page(p_num, text)
                      time.sleep(2)
          EOF

      - name: Commit and Push Page Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "Add page-wise JSON and TXT files"
          git push
