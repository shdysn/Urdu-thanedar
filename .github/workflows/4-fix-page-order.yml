name: 4 - Fix Page Order

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reorder_pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Smart Page Order & Duplicate Fixer
        run: |
          python - << 'EOF'
          import os, re, json, glob, shutil
          from difflib import SequenceMatcher

          OUTPUT_DIR = "output"
          FULL_JSON_PATH = os.path.join(OUTPUT_DIR, "full_book.json")
          PAGES_TXT_DIR = os.path.join(OUTPUT_DIR, "pages_txt")
          PAGES_JSON_DIR = os.path.join(OUTPUT_DIR, "pages_json")

          if not os.path.exists(FULL_JSON_PATH):
              print(f"❌ {FULL_JSON_PATH} نہیں ملی!")
              exit(1)

          with open(FULL_JSON_PATH, "r", encoding="utf-8") as f:
              pages = json.load(f)

          # 1. صفحات کو موجودہ نمبر کے لحاظ سے ترتیب دیں
          pages.sort(key=lambda x: int(x["page"]))

          def is_similar(t1, t2, threshold=0.85):
              # دو صفحات کے متن کی مشابہت چیک کرنا
              c1 = re.sub(r'\s+|\d+', '', t1)
              c2 = re.sub(r'\s+|\d+', '', t2)
              if not c1 or not c2:
                  return False
              return SequenceMatcher(None, c1, c2).ratio() >= threshold

          # 2. ڈپلیکیٹ صفحات کی شناخت اور صفائی (جیسے صفحہ 61 یا آخری صفحہ 154/155)
          cleaned_pages = []
          for i, p in enumerate(pages):
              p_no = int(p["page"])
              content = str(p.get("content", "")).strip()

              # الف: اگر صفحہ 61 پر غلطی سے چاکلیٹ والا صفحہ 100 آ گیا ہے تو اسے چھوڑ دیں
              if p_no == 61 and "چاکلیٹ" in content and len(pages) > 100:
                  print(f"🗑️ غلط ڈپلیکیٹ صفحہ {p_no} ہٹا دیا گیا۔")
                  continue

              # ب: اگر پچھلے صفحے اور موجودہ صفحے کا متن تقریباً ایک جیسا ہے (جیسے 154 اور 155)
              if cleaned_pages and is_similar(cleaned_pages[-1]["content"], content):
                  print(f"🗑️ متصل ڈپلیکیٹ صفحہ {p_no} پایا گیا! بہتر نسخہ رکھ کر فالتو ہٹا دیا گیا۔")
                  # دونوں میں سے جس میں تصحیح شدہ الفاظ ہوں اسے رکھیں
                  if "اسے دقت ہو رہی تھی" in content:
                      cleaned_pages[-1]["content"] = content
                  continue

              cleaned_pages.append({"page": p_no, "content": content})

          # 3. تمام صفحات کو 1 سے لے کر آخر تک مسلسل نمبر (Sequential Numbering) دینا
          for idx, item in enumerate(cleaned_pages, start=1):
              item["page"] = idx

          print(f"📚 ترتیب کے بعد کل درست صفحات: {len(cleaned_pages)}")

          # 4. تمام پرانی فائلیں صاف کر کے نئی فائلیں لکھنا
          shutil.rmtree(PAGES_TXT_DIR, ignore_errors=True)
          shutil.rmtree(PAGES_JSON_DIR, ignore_errors=True)
          os.makedirs(PAGES_TXT_DIR, exist_ok=True)
          os.makedirs(PAGES_JSON_DIR, exist_ok=True)

          for item in cleaned_pages:
              p_no = item["page"]
              content = item["content"]
              with open(os.path.join(PAGES_TXT_DIR, f"page_{p_no:04d}.txt"), "w", encoding="utf-8") as tf:
                  tf.write(content)
              with open(os.path.join(PAGES_JSON_DIR, f"page_{p_no:04d}.json"), "w", encoding="utf-8") as jf:
                  json.dump(item, jf, ensure_ascii=False, indent=2)

          # ریپوزٹری میں جہاں جہاں بک JSON فائل ہے، سب کو یکساں اپڈیٹ کریں تاکہ پرانا صفحہ 155 واپس نہ آئے
          all_jsons = [f for f in glob.glob("**/*.json", recursive=True) if not f.startswith(".git") and "pages_json" not in f]
          target_jsons = set(all_jsons + [FULL_JSON_PATH])
          for tj in target_jsons:
              try:
                  with open(tj, "w", encoding="utf-8") as out_f:
                      json.dump(cleaned_pages, out_f, ensure_ascii=False, indent=2)
                  print(f"✅ اپڈیٹ ہو گئی: {tj}")
              except Exception:
                  pass

          print("🎉 صفحات کی ترتیب اور ڈپلیکیٹس کا مسئلہ 100% حل ہو گیا!")
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Auto-fix: Cleaned duplicate pages and re-indexed book" && git push)
