name: 3 - Fix Book Errors from Report

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'corrections.txt'

permissions:
  contents: write

jobs:
  fix_errors:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply Corrections to JSON & TXT Files
        run: |
          python - << 'EOF'
          import os, re, csv, glob, json

          OUTPUT_DIR = "output"
          FULL_JSON_PATH = os.path.join(OUTPUT_DIR, "full_book.json")
          PAGES_TXT_DIR = os.path.join(OUTPUT_DIR, "pages_txt")
          PAGES_JSON_DIR = os.path.join(OUTPUT_DIR, "pages_json")
          CORRECTIONS_FILE = "corrections.txt"

          os.makedirs(PAGES_TXT_DIR, exist_ok=True)
          os.makedirs(PAGES_JSON_DIR, exist_ok=True)

          # 1. پہلے full_book.json اور pages_json سے صفحات لوڈ کریں
          pages_map = {}
          if os.path.exists(FULL_JSON_PATH):
              with open(FULL_JSON_PATH, "r", encoding="utf-8") as f:
                  for item in json.load(f):
                      pages_map[int(item["page"])] = str(item["content"])
          else:
              for jf in sorted(glob.glob(os.path.join(PAGES_JSON_DIR, "*.json"))):
                  with open(jf, "r", encoding="utf-8") as f:
                      d = json.load(f)
                      pages_map[int(d["page"])] = str(d["content"])

          if not pages_map:
              print("❌ full_book.json یا pages_json نہیں ملے!")
              exit(1)

          # 2. ہندی الفاظ، AI نوٹس اور ٹیگز صاف کرنے والا فنکشن
          HINDI_MAP = {
              "मुझे याद": "مجھے یاد",
              "मुझे": "مجھے",
              "तुम्हारी": "تمہاری",
              "गया": "گیا",
              "मत जाना": "مت جانا",
              "मत कहو": "مت کہو",
              "मत कहो": "مت کہو",
              "मत": "مت",
              "इसी": "اسی",
              "इस बार": "اس بار",
              "रहा": "رہا",
              "پڑता": "پڑتا",
              "ता": "تا",
          }

          def clean_artifacts(text):
              # [DOUBTS_START] ... [DOUBTS_END] پورا بلاک ہٹانا
              text = re.sub(r'\[DOUBTS_START\][\s\S]*?(?:\[DOUBTS_END\]|$)', '', text, flags=re.IGNORECASE)
              # ٹوٹے ہوئے یا مکمل VERDICT ٹیگز ہٹانا (جیسے [VERDICT_START یا [VERDICT_END])
              text = re.sub(r'\[/?VERDICT[A-Z_]*\]?', '', text, flags=re.IGNORECASE)
              # انگریزی AI نوٹس جیسے (Wait, let's keep...) ہٹانا
              text = re.sub(r'\(\s*Wait,\s*let\'s\s*keep[^)]*\)', '', text, flags=re.IGNORECASE)
              # ہندی الفاظ کو اردو میں بدلنا
              for hw, uw in HINDI_MAP.items():
                  text = text.replace(hw, uw)
              # اگر کوئی دیوناگری حرف بچ جائے تو صاف کرنا
              text = re.sub(r'[\u0900-\u097F]+', '', text)
              return text.strip()

          def flex_replace(text, wrong, right):
              wrong = wrong.strip()
              if not wrong or wrong == "(Not in JSON)":
                  return text, False

              # کوٹیشنز اور ڈاٹس کی لچکدار میچنگ
              if wrong in text:
                  return text.replace(wrong, right), True

              # اگر ڈاٹس (..... یا ۔۔۔) یا اسپیس یا کوٹیشنز کا فرق ہو
              pat = re.escape(wrong)
              pat = re.sub(r'(\\\.|۔|…)+', r'[\\.۔…]+', pat)
              pat = re.sub(r'(["”’’\'‘“])', r'["”’’\'‘“]*', pat)
              pat = re.sub(r'\\ ', r'\\s+', pat)
              new_text, count = re.subn(pat, right, text)
              if count > 0:
                  return new_text, True

              return text, False

          # 3. corrections.txt سے قوانین نکالنا (CSV فارمیٹ + جنرل سپورٹ)
          rules = [] # [(page_list, wrong_str, right_str, error_type)]

          if os.path.exists(CORRECTIONS_FILE):
              with open(CORRECTIONS_FILE, "r", encoding="utf-8-sig") as cf:
                  first_line = cf.readline()
                  cf.seek(0)

                  # چیک کریں کہ آیا یہ CSV فائل ہے
                  if "JSON_Page" in first_line and "Wrong_Text_in_JSON" in first_line:
                      reader = csv.DictReader(cf)
                      for row in reader:
                          j_page_str = (row.get("JSON_Page") or "").strip()
                          err_type = (row.get("Error_Type") or "").strip()
                          wrong_txt = (row.get("Wrong_Text_in_JSON") or "").strip()
                          right_txt = (row.get("Correct_Text_in_PDF") or "").strip()

                          if not wrong_txt or wrong_txt == "(Not in JSON)" or j_page_str == "N/A":
                              continue

                          # پیج نمبر یا رینج نکالنا (جیسے "4", "78-79", "93-128")
                          target_pages = []
                          if "-" in j_page_str:
                              parts = re.findall(r'\d+', j_page_str)
                              if len(parts) == 2:
                                  target_pages = list(range(int(parts[0]), int(parts[1]) + 1))
                          elif j_page_str.isdigit():
                              target_pages = [int(j_page_str)]

                          rules.append((target_pages, wrong_txt, right_txt, err_type))
                  else:
                      # اگر سادہ ٹیکسٹ یا مارک ڈاؤن ٹیبل ہو
                      for line in cf:
                          ls = line.strip()
                          if ls.startswith('|') and ls.endswith('|'):
                              cols = [c.strip() for c in ls.strip('|').split('|')]
                              if len(cols) >= 3 and re.search(r'\d+', cols[0]):
                                  p_no = int(re.search(r'\d+', cols[0]).group(0))
                                  w_s = cols[1].replace('**', '').strip('”"“ ')
                                  r_s = cols[2].replace('**', '').strip('”"“ ')
                                  rules.append(([p_no], w_s, r_s, "Table"))

          print(f"📋 Loaded {len(rules)} correction rules from {CORRECTIONS_FILE}")

          # 4. تمام قوانین کو صفحات پر لاگو کرنا
          applied_count = 0

          for target_pages, wrong_txt, right_txt, err_type in rules:
              # خاص کیس 1: صفحہ بدلتے ہوئے ڈپلیکیٹ جملہ (جیسے 78-79)
              if "Duplicate Text" in err_type and len(target_pages) == 2:
                  p1, p2 = target_pages[0], target_pages[1]
                  if p1 in pages_map and p2 in pages_map:
                      # صفحہ 78 کے آخر میں درست جملہ مکمل کریں اور صفحہ 79 کے شروع سے ڈپلیکیٹ ٹکڑا ہٹائیں
                      pages_map[p1] = re.sub(r'وہ بے بسی سے یہ سب کچھ دیکھتی رہ گئی۔?\s*$', right_txt, pages_map[p1].strip())
                      pages_map[p2] = re.sub(r'^\s*دیکھ رہی تھی۔?\s*', '', pages_map[p2].strip())
                      applied_count += 1
                      continue

              # خاص کیس 2: اگر ایک ہی خانے میں سلیش (/) سے کئی غلط الفاظ لکھے ہوں (جیسے: ڈینھیل / ڈینشیل / ڈینیمل / ڈیپشیل)
              if "/" in wrong_txt and "/" not in right_txt and "(" not in wrong_txt:
                  variants = [v.strip() for v in wrong_txt.split("/") if v.strip()]
              else:
                  variants = [wrong_txt]

              search_pages = target_pages if target_pages else list(pages_map.keys())

              for v_wrong in variants:
                  hit = False
                  for p_no in search_pages:
                      if p_no in pages_map:
                          new_t, ok = flex_replace(pages_map[p_no], v_wrong, right_txt)
                          if ok:
                              # اگر واٹر مارک ہٹایا ہے تو فالتو خالی لائن بھی صاف کریں
                              if right_txt == "":
                                  new_t = re.sub(r'\n\s*\n', '\n', new_t)
                              pages_map[p_no] = new_t
                              applied_count += 1
                              hit = True
                  # اگر مطلوبہ صفحے پر نہ ملا ہو (صفحہ نمبر آگے پیچھے ہونے کی صورت میں) تو پوری کتاب میں چیک کریں
                  if not hit:
                      for p_no in pages_map:
                          new_t, ok = flex_replace(pages_map[p_no], v_wrong, right_txt)
                          if ok:
                              pages_map[p_no] = new_t
                              applied_count += 1

          # 5. ہر صفحے سے ہندی الفاظ اور ٹیگز صاف کریں اور تمام فائلوں کو اپڈیٹ کریں
          full_book_list = []
          for p_no in sorted(pages_map.keys()):
              cleaned_content = clean_artifacts(pages_map[p_no])
              pages_map[p_no] = cleaned_content
              full_book_list.append({"page": p_no, "content": cleaned_content})

              # (الف) output/pages_txt/page_XXXX.txt اپڈیٹ کریں
              with open(os.path.join(PAGES_TXT_DIR, f"page_{p_no:04d}.txt"), "w", encoding="utf-8") as tf:
                  tf.write(cleaned_content)

              # (ب) output/pages_json/page_XXXX.json اپڈیٹ کریں
              with open(os.path.join(PAGES_JSON_DIR, f"page_{p_no:04d}.json"), "w", encoding="utf-8") as jf:
                  json.dump({"page": p_no, "content": cleaned_content}, jf, ensure_ascii=False, indent=2)

          # (ج) output/full_book.json اپڈیٹ کریں
          with open(FULL_JSON_PATH, "w", encoding="utf-8") as f:
              json.dump(full_book_list, f, ensure_ascii=False, indent=2)

          # (د) output/ میں پڑی پرانی *_page_*.txt فائلوں کو ہٹا دیں تاکہ وہ دوبارہ پرانی غلطیاں واپس نہ لائیں
          for old_raw_txt in glob.glob(os.path.join(OUTPUT_DIR, "*_page_*.txt")):
              try:
                  os.remove(old_raw_txt)
              except Exception:
                  pass

          print(f"✅ الحمد للہ! کل {applied_count} تصحیحات کامیابی سے لاگو ہو گئیں اور full_book.json، pages_json اور pages_txt اپڈیٹ ہو گئے!")
          EOF

      - name: Commit and Push Updated Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Applied CSV corrections to full_book.json, pages_json, and pages_txt" && git push)
