name: 3 - General Book Error Fixer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'corrections.txt'

permissions:
  contents: write

jobs:
  fix_errors:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install google-generativeai

      - name: Apply General Corrections to JSON & TXT
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - << 'EOF'
          import os, re, glob, json, time
          import google.generativeai as genai

          OUTPUT_DIR = "output"
          FULL_JSON_PATH = os.path.join(OUTPUT_DIR, "full_book.json")
          PAGES_TXT_DIR = os.path.join(OUTPUT_DIR, "pages_txt")
          PAGES_JSON_DIR = os.path.join(OUTPUT_DIR, "pages_json")
          CORRECTIONS_FILE = "corrections.txt"

          os.makedirs(PAGES_TXT_DIR, exist_ok=True)
          os.makedirs(PAGES_JSON_DIR, exist_ok=True)

          # 1. تمام صفحات کو لوڈ کرنا (چاہے full_book.json میں ہوں یا الگ الگ فائلوں میں)
          pages_map = {}

          # الف: اگر ریپوزٹری میں کوئی بھی لسٹ والی JSON فائل ہے (جیسے full_book.json)
          all_jsons = [f for f in glob.glob("**/*.json", recursive=True) if not f.startswith(".git")]
          book_json_files = []

          for jf in all_jsons:
              try:
                  with open(jf, "r", encoding="utf-8") as f:
                      data = json.load(f)
                  if isinstance(data, list) and len(data) > 0 and isinstance(data[0], dict) and "page" in data[0]:
                      book_json_files.append(jf)
                      for item in data:
                          p_no = int(item["page"])
                          if p_no not in pages_map and item.get("content"):
                              pages_map[p_no] = str(item["content"]).strip()
                  elif isinstance(data, dict) and "page" in data and "content" in data:
                      p_no = int(data["page"])
                      if p_no not in pages_map and data.get("content"):
                          pages_map[p_no] = str(data["content"]).strip()
              except Exception:
                  pass

          # ب: اگر الگ الگ TXT فائلیں موجود ہیں
          for tf in glob.glob(os.path.join(OUTPUT_DIR, "**", "*.txt"), recursive=True):
              nums = re.findall(r'\d+', os.path.basename(tf))
              if nums:
                  p_no = int(nums[-1])
                  if p_no not in pages_map:
                      with open(tf, "r", encoding="utf-8") as f:
                          pages_map[p_no] = f.read().strip()

          if not pages_map:
              print("❌ کوئی کتاب یا صفحات نہیں ملے!")
              exit(1)

          print(f"📚 کل {len(pages_map)} صفحات لوڈ ہو گئے۔")

          # 2. جنرل کلینر (کسی بھی کتاب میں آنے والے AI نوٹس، ٹیگز اور غیر اردو سکرپٹ کی صفائی)
          def general_clean(text):
              # انگریزی AI خود کلامی جیسے (Wait, let's keep...) وغیرہ ہٹانا
              text = re.sub(r'\(\s*(?:Wait|Note|Let\'s|Correction)[^)]*\)', '', text, flags=re.IGNORECASE)
              # [VERDICT_START] یا اس جیسے بریکٹ ٹیگز ہٹانا
              text = re.sub(r'\[/?[A-Z_]{4,}\]', '', text)
              return text.strip()

          # 3. corrections.txt کو جنرل طریقے سے پڑھنا (ٹیبل اور بلٹ لسٹ دونوں فارمیٹس)
          def clean_extracted_phrase(s):
              s = re.sub(r'\([^)]*\)', '', s).strip()
              s = re.sub(r'^[”"“\'\.\…۔]+|[”"“\'\.\…۔]+$', '', s).strip()
              return s.replace('**', '').replace('\\!', '!').replace('\\_', '_').strip()

          report_text = ""
          if os.path.exists(CORRECTIONS_FILE):
              with open(CORRECTIONS_FILE, "r", encoding="utf-8") as cf:
                  report_text = cf.read().strip()

          page_rules = {}   # {page_num: [(wrong, right), ...]}
          global_rules = [] # [(wrong, right), ...]

          if report_text:
              cur_page = None
              right_tmp = None

              for line in report_text.splitlines():
                  ls = line.strip()

                  # صفحہ نمبر کی پہچان: "صفحہ 83:" یا "- صفحہ 12:"
                  m_p = re.search(r'صفحہ\s*(\d+)', ls)
                  if m_p and not ls.startswith('|'):
                      cur_page = int(m_p.group(1))
                      right_tmp = None

                  # فارمیٹ 1: "اصل متن:" اور "فائل میں:"
                  if 'اصل متن:' in ls:
                      right_tmp = clean_extracted_phrase(ls.split('اصل متن:', 1)[1])
                      continue
                  if 'فائل میں:' in ls and right_tmp:
                      wrong_tmp = clean_extracted_phrase(ls.split('فائل میں:', 1)[1])
                      if wrong_tmp and right_tmp:
                          if cur_page:
                              page_rules.setdefault(cur_page, []).append((wrong_tmp, right_tmp))
                          global_rules.append((wrong_tmp, right_tmp))
                      right_tmp = None
                      continue

                  # فارمیٹ 2: ایک ہی لائن میں "کی جگہ" یا "کے لیے" (جیسے: لفظ ”گیا“ کی جگہ ”गया“ درج ہے)
                  quotes = re.findall(r'[”"“]([^”"“]+)[”"“]', ls)
                  if len(quotes) == 2 and ('کی جگہ' in ls or 'کے لیے' in ls or 'بجائے' in ls):
                      # عام طور پر پہلا کوٹ درست لفظ ہوتا ہے اور دوسرا غلط (یا دیوناگری والا غلط)
                      q1, q2 = quotes[0].strip(), quotes[1].strip()
                      if re.search(r'[\u0900-\u097F]', q2):
                          wrong_q, right_q = q2, q1
                      elif re.search(r'[\u0900-\u097F]', q1):
                          wrong_q, right_q = q1, q2
                      else:
                          right_q, wrong_q = q1, q2
                      if cur_page:
                          page_rules.setdefault(cur_page, []).append((wrong_q, right_q))
                      global_rules.append((wrong_q, right_q))
                      continue

                  # فارمیٹ 3: مارک ڈاؤن ٹیبل | صفحہ نمبر | فائل میں موجود متن | اصل کتاب کا درست متن |
                  if ls.startswith('|') and ls.endswith('|'):
                      cols = [c.strip() for c in ls.strip('|').split('|')]
                      if len(cols) >= 3:
                          pm = re.search(r'(\d+)', cols[0])
                          if pm:
                              p_no = int(pm.group(1))
                              w_str = clean_extracted_phrase(cols[1])
                              r_str = clean_extracted_phrase(cols[2])
                              if w_str and r_str:
                                  page_rules.setdefault(p_no, []).append((w_str, r_str))
                                  global_rules.append((w_str, r_str))

          def flex_replace(text, wrong, right):
              if wrong in text:
                  return text.replace(wrong, right), True
              # اگر ڈاٹس یا اسپیس کا معمولی فرق ہو
              pat = re.escape(wrong)
              pat = re.sub(r'(\\\.|۔)+', r'[\\.۔…]+', pat)
              pat = re.sub(r'\\ ', r'\\s+', pat)
              new_t, count = re.subn(pat, right, text)
              return new_t, (count > 0)

          # 4. پہلے Python کے ذریعے تمام صفحات پر قوانین لاگو کرنا
          unresolved_pages = set()
          fixed_count = 0

          for p_no in sorted(pages_map.keys()):
              txt = general_clean(pages_map[p_no])
              if p_no in page_rules:
                  for w_s, r_s in page_rules[p_no]:
                      txt, ok = flex_replace(txt, w_s, r_s)
                      if ok:
                          fixed_count += 1
                      else:
                          unresolved_pages.add(p_no)
              pages_map[p_no] = txt

          # اگر صفحہ نمبر تھوڑا آگے پیچھے ہو (جیسے PDF بمقابلہ کتاب کا صفحہ نمبر)، تو پوری کتاب پر چیک کریں
          for w_s, r_s in global_rules:
              for p_no in pages_map:
                  pages_map[p_no], ok = flex_replace(pages_map[p_no], w_s, r_s)
                  if ok:
                      fixed_count += 1

          # 5. جن صفحات کی پیچیدہ غلطیاں سادہ ریپلیس سے حل نہ ہو سکیں، انہیں Gemini AI سے ٹھیک کروانا
          api_key = os.environ.get("GEMINI_API_KEY")
          if api_key and report_text and unresolved_pages:
              genai.configure(api_key=api_key)
              model = genai.GenerativeModel("gemini-2.5-flash")
              for p_no in sorted(unresolved_pages):
                  if p_no not in pages_map:
                      continue
                  print(f"🤖 AI Fixing complex errors on Page {p_no}...")
                  prompt = f"""آپ ایک ماہر اردو ایڈیٹر ہیں۔
          نیچے دی گئی غلطیوں کی رپورٹ کو دیکھتے ہوئے صفحہ نمبر {p_no} کے متن میں مطلوبہ تصحیحات کریں اور غیر اردو (ہندی/انگریزی نوٹس) الفاظ کو درست اردو میں بدل دیں۔
          باقی اصل متن میں کوئی تبدیلی نہ کریں اور صرف صفحے کا مکمل درست متن واپس کریں۔

          --- رپورٹ ---
          {report_text}

          --- صفحہ {p_no} کا متن ---
          {pages_map[p_no]}"""
                  try:
                      res = model.generate_content(prompt)
                      if res and res.text and len(res.text.strip()) > 30:
                          pages_map[p_no] = general_clean(res.text.strip())
                      time.sleep(2)
                  except Exception as e:
                      print(f"AI skip page {p_no}: {e}")

          # 6. تمام فائلوں (full_book.json + pages_json + pages_txt) کو اپڈیٹ کرنا
          full_book_list = []
          for p_no in sorted(pages_map.keys()):
              content = pages_map[p_no]
              full_book_list.append({"page": p_no, "content": content})

              with open(os.path.join(PAGES_TXT_DIR, f"page_{p_no:04d}.txt"), "w", encoding="utf-8") as tf:
                  tf.write(content)
              with open(os.path.join(PAGES_JSON_DIR, f"page_{p_no:04d}.json"), "w", encoding="utf-8") as jf:
                  json.dump({"page": p_no, "content": content}, jf, ensure_ascii=False, indent=2)

          # output/full_book.json اور دیگر تمام بک JSON فائلوں کو اپڈیٹ کریں
          target_jsons = set(book_json_files + [FULL_JSON_PATH])
          for tj in target_jsons:
              os.makedirs(os.path.dirname(tj) or ".", exist_ok=True)
              with open(tj, "w", encoding="utf-8") as out_f:
                  json.dump(full_book_list, out_f, ensure_ascii=False, indent=2)
              print(f"✅ Updated Book JSON: {tj}")

          print(f"🎉 کل {fixed_count} تصحیحات کامیابی سے لاگو ہو گئیں!")
          EOF

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Auto-update: Applied corrections from corrections.txt" && git push)
