name: Archival Urdu Digitizer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'input/**'
      - '*.pdf'
      - 'digitizer.py'

permissions:
  contents: write

jobs:
  digitize_and_combine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai pymupdf pillow

      - name: Run Digitizer & Create Full Book JSON
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python digitizer.py

      - name: Commit and Push Output Files (TXT + JSON)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "Auto-update: Page-wise TXT and single full_book.json"
          git push
