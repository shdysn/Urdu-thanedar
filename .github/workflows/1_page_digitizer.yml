name: 1 - Page Wise Digitizer

on:
  workflow_dispatch:
  push:
    paths:
      - 'input/**'

jobs:
  digitize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run OCR
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py
      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/pages_txt/ output/pages_json/ output/DOUBT_REPORT.txt || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-digitize new pages [skip ci]"
          git push
