<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urdu Archival Book Reader</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            padding: 40px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #ddd;
        }

        button, input[type="file"] {
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
        }

        button:hover {
            background: #eee;
        }

        .book-content {
            font-size: 20px;
            line-height: 2;
            text-align: justify;
        }

        .page {
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px dashed #ccc;
            position: relative;
        }

        .page-number {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 0 10px;
            color: #888;
            font-size: 14px;
        }

        .arabic-text {
            font-family: 'Amiri', serif;
            font-size: 24px;
            color: #2c3e50;
            text-align: center;
            display: block;
            margin: 20px 0;
        }

        @media print {
            body {
                background: none;
                padding: 0;
            }
            .container {
                box-shadow: none;
                padding: 0;
                max-width: none;
            }
            .controls {
                display: none;
            }
            .page {
                page-break-after: always;
                border: none;
                margin-bottom: 0;
                padding-bottom: 0;
            }
            .page-number {
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
            }
            @page {
                size: A4;
                margin: 20mm;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="controls">
            <div>
                <input type="file" id="fileInput" accept=".json">
            </div>
            <div>
                <button onclick="window.print()">Print / Save PDF</button>
            </div>
        </div>

        <div id="bookViewer" class="book-content">
            <p style="text-align:center; color:#888;">Loading book...</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Try to load default full_book.json
            fetch('output/full_book.json')
                .then(response => {
                    if (!response.ok) throw new Error("File not found");
                    return response.json();
                })
                .then(data => renderBook(data))
                .catch(err => {
                    document.getElementById('bookViewer').innerHTML = '<p style="text-align:center; color:#888;">Please select a JSON file to read.</p>';
                });
        });

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const json = JSON.parse(e.target.result);
                        renderBook(json);
                    } catch (err) {
                        alert("Invalid JSON file.");
                    }
                };
                reader.readAsText(file);
            }
        });

        function formatText(text) {
            // Split into paragraphs
            let lines = text.split('\n');
            let formattedHtml = '';

            let currentParagraph = '';
            let isArabicBlock = false;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) {
                    if (currentParagraph) {
                        if (isArabicBlock) {
                            formattedHtml += `<span class="arabic-text">${currentParagraph}</span>`;
                        } else {
                            formattedHtml += `<p>${currentParagraph}</p>`;
                        }
                        currentParagraph = '';
                        isArabicBlock = false;
                    }
                    continue;
                }

                // Check if the line is Arabic/Quranic (using basic heuristics: brackets)
                let hasArabicBrackets = line.includes('﴿') || line.includes('﴾') || line.includes('{') || line.includes('}');

                // If it's a continuation
                if (currentParagraph) {
                     if (isArabicBlock && hasArabicBrackets) {
                         currentParagraph += ' ' + line;
                     } else if (!isArabicBlock && !hasArabicBrackets) {
                         currentParagraph += ' ' + line;
                     } else {
                         // Flush current and start new
                         if (isArabicBlock) {
                             formattedHtml += `<span class="arabic-text">${currentParagraph}</span>`;
                         } else {
                             formattedHtml += `<p>${currentParagraph}</p>`;
                         }
                         currentParagraph = line;
                         isArabicBlock = hasArabicBrackets;
                     }
                } else {
                    currentParagraph = line;
                    isArabicBlock = hasArabicBrackets;
                }
            }

            // Flush remaining
            if (currentParagraph) {
                if (isArabicBlock) {
                    formattedHtml += `<span class="arabic-text">${currentParagraph}</span>`;
                } else {
                    formattedHtml += `<p>${currentParagraph}</p>`;
                }
            }

            // Clean up Arabic markers from view if needed
            // formattedHtml = formattedHtml.replace(/[﴿﴾{}]/g, '');

            return formattedHtml;
        }

        function renderBook(bookData) {
            const viewer = document.getElementById('bookViewer');
            viewer.innerHTML = '';

            // Sort pages just in case
            bookData.sort((a, b) => a.page - b.page);

            bookData.forEach(pageData => {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'page';

                const contentHtml = formatText(pageData.content);
                pageDiv.innerHTML = contentHtml;

                const pageNum = document.createElement('div');
                pageNum.className = 'page-number';
                pageNum.innerText = pageData.page;

                pageDiv.appendChild(pageNum);
                viewer.appendChild(pageDiv);
            });
        }
    </script>
</body>
</html>
